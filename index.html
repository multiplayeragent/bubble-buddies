<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubble Buddies</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #120e2b; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 4px #0009; }
  #bar { top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; gap: 18px; font: 900 18px/1 system-ui, sans-serif; letter-spacing: .04em; }
  #bar span small { font-size: 11px; opacity: .7; margin-right: 5px; } #bar .hearts { color: #ff5d8f; letter-spacing: 1px; }
  #msg { top: 34%; left: 0; right: 0; text-align: center; font: 900 48px/1 system-ui, sans-serif; color: #ffe66d; -webkit-text-stroke: 2px #5a2a00; transition: opacity .3s; }
  #msg small { display: block; margin-top: 8px; font-size: 17px; color: #fff; -webkit-text-stroke: 0; }
  #hint { top: 24%; left: 0; right: 0; text-align: center; font-size: 14px; font-weight: 700; padding: 0 12px; transition: opacity .8s; }
  #net { bottom: max(4px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 12px; opacity: .7; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0820b0; }
  #over[hidden], .pad[hidden] { display: none; }
  .card { box-sizing: border-box; width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 18px; background: #241c52; border: 2px solid #ffffff22; text-align: center; }
  .card h2 { margin: 0 0 4px; font-size: 28px; color: #ffe66d; } .card h3 { margin: 14px 0 4px; font-size: 13px; color: #8be9ff; text-align: left; text-transform: uppercase; letter-spacing: .06em; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; min-height: 30px; }
  .card li span { float: right; font-variant-numeric: tabular-nums; }
  .card p { margin: 10px 0 0; font-size: 13px; opacity: .75; }
  button.go { width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: 12px; background: #ffe66d; color: #3a2400; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  .pad { position: fixed; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 20px); touch-action: none; display: flex; gap: 12px; }
  .pad button { width: 70px; height: 70px; border-radius: 50%; border: 2px solid #ffffff66; background: #ffffff1c; color: #fff; font: 800 15px system-ui, sans-serif; touch-action: none; }
  .pad button.on { background: #ffffff55; }
  #padL { left: max(12px, env(safe-area-inset-left)); } #padR { right: max(12px, env(safe-area-inset-right)); }
  #padR [data-k=blow] { background: #59d8ff44; } #padR [data-k=jump] { background: #ff5d8f44; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="bar"></div>
<div class="hud" id="msg"></div>
<div class="hud" id="hint"></div>
<div class="hud" id="net">Connecting…</div>
<div class="pad" id="padL" hidden><button data-k="left">◀</button><button data-k="right">▶</button></div>
<div class="pad" id="padR" hidden><button data-k="blow">BUBBLE</button><button data-k="jump">JUMP</button></div>
<div id="over" hidden><div class="card">
  <h2 id="overTitle">Game over</h2><div id="overSub"></div>
  <h3>Best teams</h3><ol id="board"><li>Loading…</li></ol>
  <button class="go" id="again">Play again</button><p id="next"></p>
</div></div>
<script>
/* ═══ BUBBLE BUDDIES · a Multiplayer Agent starter ══════════════════════════════════════
 * Blow bubbles, trap the critters, pop them into fruit. Co-op, 1–4 players; a bot buddy
 * joins you when you play alone.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ lives, speeds, bubbles, critters, timings
 *   LEVELS ........ the five screens (# = a block you can jump up through and stand on)
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   PHYSICS ....... one function moves anyone: run, jump through blocks, land, wrap top/bottom
 *   GAME (HOST) ... levels, lives, score, critters, bubbles, fruit. Only the host writes these.
 *   BUDDY BOTS .... the helpers: line up with a critter, blow, pop, grab the fruit
 *   ME ............ my body, my bubbles, popping, riding, getting caught. Each player writes only its own.
 *   DRAW .......... blocks, players, critters, bubbles, fruit, sparkles
 *   HUD & OVER .... score, level, hearts, the game-over card, leaderboard
 *   INPUT ......... keyboard, and touch buttons
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one JSON field: position, speed, facing,
 *     on the ground, dead, blinking, blowing) about 15 times a second, `hb` (heartbeat)
 *     once a second, and `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields:
 *       `game`  {id, v, lv, ph: intro|play|clear|over, at, lives, score, hurry, h}: when it changes;
 *       `world` {v, e: critters, b: bubbles, f: fruit, u: bot buddies}: about 12 times a second.
 *     A new host adopts both from state and carries on.
 *   - Intents to the host: "blow" {x, y, f} (it makes the bubble), "pop" {i} (I touched
 *     bubble i), "grab" {i} (I touched fruit i), "hurt" {n} (a critter caught me: my n-th
 *     time, so the host takes one life once), "again" {} (new game). The host's own player
 *     calls the same functions directly. Getting caught is the caught player's own call.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "team-score": the team's score, sent by every player when the game ends.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 2,             // bots fill the team up to this many players: alone, you get one buddy
  lives: 5,             // the team's shared lives at the start
  maxLives: 9,          // a cleared level gives one back, up to this
  speed: 175,           // run speed, px/s (the screen is 640 × 480)
  jump: 660,            // jump speed, px/s: about four blocks high
  gravity: 1550,        // px/s²
  maxFall: 560,         // px/s
  blowEvery: 0.3,       // seconds between your bubbles
  maxBubbles: 18,       // the oldest empty bubble pops when there are more
  shootSpeed: 430,      // px/s a new bubble flies forward ...
  shootTime: 0.36,      // ... for this long (it can only catch a critter while flying)
  riseSpeed: 40,        // px/s bubbles float up afterwards
  bubbleLife: 7,        // seconds an empty bubble lasts
  trappedLife: 9,       // seconds before a trapped critter breaks free (angry and faster)
  critterSpeed: 70,     // px/s
  angry: 1.7,           // an angry critter is this much faster
  hurryAfter: 45000,    // ms into a level before every critter gets angry
  introMs: 1800,        // the "Level N" banner
  clearMs: 2800,        // time to grab the fruit after the last critter
  overMs: 20000,        // the game-over card shows this long before a new game
  invMs: 2200,          // ms you blink (can't be caught) after you come back
  respawnMs: 1100,      // ms before you come back after being caught
  fruitLife: 10000,     // ms fruit stays
  fruitPts: [100, 200, 500, 1000], // cherry, banana, melon, gem: bigger chains pop better fruit
  popPts: 10,           // popping an empty bubble
  board: "team-score",  // leaderboard name
};
const BOT_NAMES = ["Puff", "Fizz", "Bloop", "Suds"];
const COLORS = ["#7ee081", "#59d8ff", "#ff8fd6", "#ffb347", "#c49bff", "#fff275"];

// ── LEVELS ──────────────────────────────────────────────────────────────────────────
// 20 × 15 blocks of 32px. # = a block: the side walls are solid; every other block you can
// jump up through from below and stand on. The gap in the floor and ceiling wraps around:
// fall through the bottom and you drop in from the top.
const T = 32, COLS = 20, ROWS = 15, WW = COLS * T, WH = ROWS * T, BW = 24, BH = 26;
const LEVELS = [
  { name: "Bubble Garden", colors: ["#ff6fa5", "#ffd1e3", "#2a1747"], map: [
    "########....########", "#..................#", "#..................#", "#..................#",
    "#...############...#", "#..................#", "#..................#", "#####..........#####",
    "#..................#", "#..................#", "#...############...#", "#..................#",
    "#..................#", "#..................#", "########....########"] },
  { name: "Twin Shelves", colors: ["#59d8ff", "#d6f6ff", "#14234a"], map: [
    "########....########", "#..................#", "#..................#", "#..................#",
    "#..####......####..#", "#..................#", "#..................#", "#......######......#",
    "#..................#", "#..................#", "#..####......####..#", "#..................#",
    "#..................#", "#..................#", "########....########"] },
  { name: "Steps", colors: ["#ffb347", "#ffe9c7", "#2e1a12"], map: [
    "########....########", "#..................#", "#..................#", "#..................#",
    "#..###........###..#", "#..................#", "#..................#", "#.....########.....#",
    "#..................#", "#..................#", "#.###..........###.#", "#..................#",
    "#..................#", "#..................#", "########....########"] },
  { name: "Columns", colors: ["#7ee081", "#dcffd9", "#132a1a"], map: [
    "########....########", "#..................#", "#..................#", "#..................#",
    "#.####..####..####.#", "#..................#", "#..................#", "#....##########....#",
    "#..................#", "#..................#", "#.####..####..####.#", "#..................#",
    "#..................#", "#..................#", "########....########"] },
  { name: "The Ring", colors: ["#c49bff", "#efe3ff", "#1f1440"], map: [
    "########....########", "#..................#", "#..................#", "#..................#",
    "#....##########....#", "#..................#", "#..................#", "#.###..........###.#",
    "#..................#", "#..................#", "#....##########....#", "#..................#",
    "#..................#", "#..................#", "########....########"] },
];
const SPAWNS = [56, 584, 112, 528]; // x of each player's start on the floor
const levelOf = (lv) => LEVELS[(Math.max(1, lv) - 1) % LEVELS.length];
const block = (L, c, r) => c <= 0 || c >= COLS - 1 || (r >= 0 && r < ROWS && L.map[r][c] === "#");

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'bubble-buddies',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");
if (ATTRACT) Object.assign(CONFIG, { seats: 2, lives: 9, introMs: 700, clearMs: 1500, overMs: 1500, hurryAfter: 20000, shootTime: 0.42 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v ?? fallback;
  const v = parse(raw, null); parsed.set(key, { raw, v }); return v ?? fallback;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);

// ── PHYSICS ─────────────────────────────────────────────────────────────────────────
// A body: { x (center), y (feet), vx, vy, f (facing), ground, dropRow, dropUntil }. ctl = { x: -1..1, jump, down }.
function step(b, ctl, dt, L, speed) {
  const want = (ctl.x || 0) * speed, acc = (b.ground ? 2400 : 1500) * dt;
  b.vx += Math.max(-acc, Math.min(acc, want - b.vx));
  if (ctl.x) b.f = Math.sign(ctl.x);
  if (ctl.jump && b.ground) { b.vy = -CONFIG.jump; b.ground = false; }
  if (ctl.down && b.ground && b.y < (ROWS - 1) * T - 1) { b.dropRow = Math.round(b.y / T); b.dropUntil = performance.now() + 220; b.ground = false; b.y += 1; } // drop through the block you stand on
  b.vy = Math.min(CONFIG.maxFall, b.vy + CONFIG.gravity * dt);
  b.x = Math.max(T + BW / 2, Math.min(WW - T - BW / 2, b.x + b.vx * dt)); // the side walls
  const oldY = b.y; b.y += b.vy * dt; b.ground = false;
  if (b.vy >= 0) { // land on any block whose top we just passed
    for (let r = Math.max(1, Math.floor(oldY / T)); r <= Math.min(ROWS - 1, Math.floor(b.y / T)); r++) {
      const top = r * T;
      if (oldY > top + 0.5 || b.y < top || (r === b.dropRow && performance.now() < b.dropUntil)) continue;
      if (block(L, Math.floor((b.x - BW / 2 + 3) / T), r) || block(L, Math.floor((b.x + BW / 2 - 3) / T), r)) { b.y = top; b.vy = 0; b.ground = true; break; }
    }
  } else if (b.y - BH < T && oldY - BH >= T - 1 && (block(L, Math.floor((b.x - BW / 2 + 3) / T), 0) || block(L, Math.floor((b.x + BW / 2 - 3) / T), 0))) { b.y = T + BH; b.vy = 0; } // bump the ceiling
  if (b.y > WH + BH) b.y -= WH + BH + 4; // fell through the floor gap: drop in from the top
  else if (b.y < -BH - 4) b.y += WH + BH; // jumped out of the top gap: come up from the bottom
}
const overlap = (a, b, shrink = 1) => Math.abs(a.x - b.x) < (BW * shrink + (b.w || BW)) / 2 && Math.abs((a.y - BH / 2) - (b.y - (b.h ?? BH) / 2)) < (BH * shrink + (b.h ?? BH)) / 2;
const touchBubble = (a, b) => Math.hypot(a.x - b.x, a.y - BH / 2 - b.y) < 16 + 15;

// ── GAME (HOST) ─────────────────────────────────────────────────────────────────────
// Critters: { i, k (0 wind-up, 1 hopper, 2 ghost), x, y, vx, vy, f, ground, a (angry) }
// Bubbles:  { i, x, y, vx, vy, k (-1 empty, else the critter inside), a, born (Date.now ms), by }
// Fruit:    { i, x, y, vy, k (0..3), ground, born }
const host = { acting: false, last: null, lastW: null, crit: new Map(), bub: new Map(), fruit: new Map(), bots: new Map(), nextId: 1, lastWorld: 0, again: false, cd: new Map() };
/** The game as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function game() {
  const g = parseOnce("game", S.shared.game, null);
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
const sharedWorld = () => parseOnce("world", S.shared.world, { v: 0, e: [], b: [], f: [], u: [] });
const age = (b) => (Date.now() - b.born) / 1000;
const humansHere = () => livePlayers().filter((id) => !(ATTRACT && id === me.id));

/** Become host: take over the critters, bubbles, fruit and bot buddies exactly as state has them. */
function adopt() {
  host.acting = true; host.last = null; host.crit.clear(); host.bub.clear(); host.fruit.clear(); host.bots.clear();
  const w = sharedWorld(), t = Date.now();
  host.lastW = w.v || 0;
  for (const [i, k, x, y, f, a] of w.e || []) host.crit.set(i, { i, k, x, y, vx: k === 2 ? f * 80 : 0, vy: k === 2 ? 60 : 0, f, a, ground: false, hopAt: 0 });
  for (const [i, x, y, k, a, ag] of w.b || []) host.bub.set(i, { i, x, y, vx: 0, vy: 0, k, a, born: t - ag * 100 });
  for (const [i, x, y, k] of w.f || []) host.fruit.set(i, { i, x, y, vy: 0, k, ground: false, born: t });
  for (const u of w.u || []) host.bots.set(u.i, Object.assign(newBody(u.x, u.y), { id: u.i, name: u.n, color: u.c, f: u.f || 1, dead: !!u.d, deadUntil: performance.now() + 800, inv: u.v ? performance.now() + 1000 : 0, cd: 0, hurtN: 0 }));
  host.nextId = 1 + Math.max(0, ...[...host.crit.keys(), ...host.bub.keys(), ...host.fruit.keys()]);
}
const newBody = (x, y) => ({ x, y, vx: 0, vy: 0, f: 1, ground: false, dropRow: -1, dropUntil: 0 });

/** Fill a level with critters on its blocks (never on the floor where players start). */
function buildLevel(lv) {
  host.crit.clear(); host.bub.clear(); host.fruit.clear();
  const L = levelOf(lv), spots = [];
  for (const r of [4, 7, 10]) for (let c = 2; c < COLS - 2; c++) if (L.map[r][c] === "#" && L.map[r][c - 1] === "#" && L.map[r][c + 1] === "#") spots.push([c * T + T / 2, r * T]);
  const n = Math.min(8, 3 + lv) + (ATTRACT ? 2 : 0);
  for (let i = 0; i < n && spots.length; i++) {
    const [x, y] = spots.splice(Math.floor(Math.random() * spots.length), 1)[0];
    const k = lv >= 3 && i % 3 === 2 ? 2 : lv >= 2 && i % 2 === 1 ? 1 : 0;
    const id = host.nextId++;
    host.crit.set(id, { i: id, k, x, y: k === 2 ? y - 40 : y, vx: k === 2 ? (Math.random() < 0.5 ? -80 : 80) : 0, vy: k === 2 ? 60 : 0, f: Math.random() < 0.5 ? -1 : 1, a: 0, ground: false, hopAt: 0 });
  }
  for (const b of host.bots.values()) placeAtSpawn(b);
}
function newGame(id) {
  buildLevel(1);
  return writeGame({ id, lv: 1, ph: "intro", at: Date.now(), lives: CONFIG.lives, score: 0, hurry: 0, h: {} });
}
const addScore = (n) => { const g = game(); if (g && n) writeGame({ ...g, score: g.score + n }); };

/** A "blow" intent (or my own, or a bot's): a new bubble in front of whoever blew it. */
function applyBlow(from, msg) {
  const g = game(), who = bodyOf(from);
  if (!g || g.ph === "over" || !who || Math.hypot(who.x - msg.x, who.y - msg.y) > 90) return;
  const t = performance.now(); if (t < (host.cd.get(from) || 0)) return;
  host.cd.set(from, t + CONFIG.blowEvery * 800);
  const f = msg.f < 0 ? -1 : 1, id = host.nextId++;
  host.bub.set(id, { i: id, x: Math.max(T + 16, Math.min(WW - T - 16, msg.x + f * 14)), y: msg.y - BH / 2, vx: f * CONFIG.shootSpeed, vy: 0, k: -1, a: 0, born: Date.now(), by: from });
  if (host.bub.size > CONFIG.maxBubbles) { const old = [...host.bub.values()].find((b) => b.k < 0); if (old) host.bub.delete(old.i); }
}
/** A "pop" intent: that bubble pops, and so does every bubble touching it (a chain). Trapped critters turn into fruit. */
function applyPop(from, msg) {
  const first = host.bub.get(msg.i), who = bodyOf(from);
  if (!first || !who || age(first) < CONFIG.shootTime * 0.8 || Math.hypot(who.x - first.x, who.y - BH / 2 - first.y) > 90) return;
  const chain = [first], seen = new Set([first.i]);
  for (let k = 0; k < chain.length; k++) for (const b of host.bub.values()) if (!seen.has(b.i) && age(b) > CONFIG.shootTime && Math.hypot(b.x - chain[k].x, b.y - chain[k].y) < 38) { seen.add(b.i); chain.push(b); }
  let caught = 0, pts = 0;
  for (const b of chain) {
    host.bub.delete(b.i); pts += CONFIG.popPts;
    if (b.k >= 0) { const id = host.nextId++; host.fruit.set(id, { i: id, x: b.x, y: b.y + 10, vy: -380 - Math.random() * 120, vx: (Math.random() - 0.5) * 160, k: Math.min(3, caught), ground: false, born: Date.now() }); caught++; }
    const fx = { k: b.k >= 0 ? "fruit" : "pop", x: Math.round(b.x), y: Math.round(b.y) };
    net.send("fx", fx); onFx(fx);
  }
  addScore(pts);
}
/** A "grab" intent: whoever touched that fruit gets the team its points. */
function applyGrab(from, msg) {
  const f = host.fruit.get(msg.i), who = bodyOf(from);
  if (!f || !who || Math.hypot(who.x - f.x, who.y - f.y) > 80) return;
  host.fruit.delete(f.i);
  const fx = { k: "got", x: Math.round(f.x), y: Math.round(f.y - 16), pts: CONFIG.fruitPts[f.k] };
  net.send("fx", fx); onFx(fx); addScore(fx.pts);
}
/** A "hurt" intent: a critter caught someone (its n-th time, so a repeat costs nothing). One life less. */
function applyHurt(from, n) {
  const g = game();
  if (!g || (g.ph !== "play" && g.ph !== "clear") || n <= (g.h[from] || 0)) return;
  const lives = g.lives - 1;
  writeGame({ ...g, lives: Math.max(0, lives), h: { ...g.h, [from]: n }, ...(lives <= 0 ? { ph: "over", at: Date.now() } : {}) });
}

  if (!m) return;
  if (m.k === "pop") { puff(m.x, m.y, "#bff3ff", 8, 120); sfx("pop"); }
  if (m.k === "fruit") { puff(m.x, m.y, "#ffe66d", 16, 220); sfx("pop"); }
  if (m.k === "trap") { puff(m.x, m.y, "#8be9ff", 10, 140); sfx("trap"); }
  if (m.k === "free") { puff(m.x, m.y, "#ff5d5d", 12, 180); }
  if (m.k === "got") { texts.push({ x: m.x, y: m.y, text: "+" + m.pts, life: 1 }); puff(m.x, m.y, "#ffe66d", 10, 120); sfx("coin"); }
}
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); };

function draw(g, L, dt, t) {
  shake *= Math.pow(0.02, dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const [main, light, bg] = L.colors;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(DPR * view.s, 0, 0, DPR * view.s, DPR * (view.ox + (Math.random() - 0.5) * shake), DPR * (view.oy + (Math.random() - 0.5) * shake));
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, WW, WH); ctx.clip();
  const grd = ctx.createLinearGradient(0, 0, 0, WH); grd.addColorStop(0, "#00000000"); grd.addColorStop(1, "#ffffff10"); ctx.fillStyle = grd; ctx.fillRect(0, 0, WW, WH);
  ctx.strokeStyle = "#ffffff14"; ctx.lineWidth = 2; // faint background bubbles drifting up
  for (let i = 0; i < 14; i++) { const x = (i * 97) % WW, y = WH - ((t * 18 + i * 61) % (WH + 60)) + 30; ctx.beginPath(); ctx.arc(x + Math.sin(t + i) * 10, y, 6 + (i % 4) * 5, 0, 6.28); ctx.stroke(); }
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { // the blocks
    if (L.map[r][c] !== "#") continue;
    const x = c * T, y = r * T, wall = c === 0 || c === COLS - 1;
    ctx.fillStyle = wall ? "#00000055" : "#00000044"; rr(x + 2, y + 4, T - 2, T - 2, 7); ctx.fill();
    ctx.fillStyle = main; rr(x + 1, y + 1, T - 2, T - 2, 7); ctx.fill();
    ctx.fillStyle = light; rr(x + 5, y + 4, T - 10, 6, 3); ctx.fill();
    ctx.fillStyle = "#00000022"; ctx.beginPath(); ctx.arc(x + T / 2, y + T / 2 + 4, 4, 0, 6.28); ctx.fill();
  }
  for (const f of scene().fruit) drawFruit(f, t);
  for (const c of scene().crits) drawCritter(c.k, c.x, c.y, c.f, c.a, t, 1);
  for (const b of scene().bodies) drawBuddy(b, t);
  for (const b of scene().bubbles) drawBubble(b, t);
  for (const p of sparks) { ctx.globalAlpha = Math.min(1, p.life * 2.5); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill(); }
  ctx.globalAlpha = 1; ctx.textAlign = "center"; ctx.font = "900 18px system-ui, sans-serif"; ctx.lineWidth = 4; ctx.strokeStyle = "#3a2400";
  for (const x of texts) { ctx.globalAlpha = Math.min(1, x.life * 2); ctx.strokeText(x.text, x.x, x.y); ctx.fillStyle = "#ffe66d"; ctx.fillText(x.text, x.x, x.y); }
  ctx.globalAlpha = 1; ctx.restore();
}
/** A round little bubble-blower: body, belly, spikes on the back, big eyes; puffed cheeks when blowing. */
function drawBuddy(b, t) {
  if (b.d) return;
  if (b.v && Math.floor(t * 12) % 2) return; // blinking: just came back
  const x = b.x, y = b.y, f = b.f || 1, run = b.mv > 25 && b.g ? Math.sin(t * 20 + x) : 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(f, 1);
  ctx.fillStyle = "#00000040"; ctx.beginPath(); ctx.ellipse(0, 0, 13, 3, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = "#3a2e5a"; ctx.beginPath(); ctx.ellipse(-6 + run * 3, -2, 6, 4, 0, 0, 6.28); ctx.ellipse(6 - run * 3, -2, 6, 4, 0, 0, 6.28); ctx.fill(); // feet
  ctx.fillStyle = shade(b.color, -30); for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-13 + i * 2, -10 - i * 6); ctx.lineTo(-19 + i * 2, -14 - i * 6); ctx.lineTo(-11 + i * 3, -16 - i * 6); ctx.fill(); } // back spikes
  ctx.fillStyle = b.color; ctx.beginPath(); ctx.ellipse(0, -13, 13, 13, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = "#ffffff55"; ctx.beginPath(); ctx.ellipse(3, -9, 7, 6, 0, 0, 6.28); ctx.fill(); // belly
  for (const ex of [1, 8]) { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(ex, -20, 4.5, 5.5, 0, 0, 6.28); ctx.fill(); ctx.fillStyle = "#1b1530"; ctx.beginPath(); ctx.arc(ex + 1.5, -19.5, 2.4, 0, 6.28); ctx.fill(); }
  if (b.w) { ctx.fillStyle = "#ff8fb0"; ctx.beginPath(); ctx.arc(11, -11, 4.5, 0, 6.28); ctx.fill(); ctx.fillStyle = "#1b1530"; ctx.beginPath(); ctx.arc(13, -11, 2.2, 0, 6.28); ctx.fill(); } // puffed cheeks, "o" mouth
  else { ctx.strokeStyle = "#1b1530"; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(9, -12, 3, 0.2, 2.2); ctx.stroke(); }
  ctx.restore();
  if (!ATTRACT || b.mine) { ctx.font = "800 10px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.lineWidth = 3; ctx.strokeStyle = "#000a"; ctx.strokeText(b.name, x, y - 32); ctx.fillStyle = b.mine ? "#ffe66d" : "#fff"; ctx.fillText(b.name, x, y - 32); }
}
function shade(hex, amt) { const n = parseInt(hex.slice(1), 16), c = (v) => Math.max(0, Math.min(255, v + amt)); return `rgb(${c(n >> 16)},${c((n >> 8) & 255)},${c(n & 255)})`; }
/** The critters: k 0 = wind-up toy (a key on its back), 1 = spring hopper, 2 = ghost. Angry ones turn red. */
function drawCritter(k, x, y, f, angry, t, scale) {
  ctx.save(); ctx.translate(x, y); ctx.scale(scale * (f || 1), scale);
  const body = angry ? "#ff5d5d" : ["#b388ff", "#6ee7b7", "#f1f5ff"][k], dark = angry ? "#8a1c1c" : ["#5b3a9e", "#1f7a55", "#8b93b8"][k];
  if (k === 0) {
    ctx.fillStyle = dark; ctx.fillRect(-11, -4, 6, 4); ctx.fillRect(5, -4, 6, 4); // feet
    ctx.fillStyle = body; rr(-12, -26, 24, 23, 6); ctx.fill();
    ctx.save(); ctx.translate(-14, -15); ctx.rotate(t * 8); ctx.fillStyle = "#ffd166"; ctx.fillRect(-1.5, -7, 3, 14); ctx.fillRect(-6, -7, 12, 3); ctx.fillRect(-6, 4, 12, 3); ctx.restore(); // the wind-up key
    ctx.fillStyle = "#fff"; ctx.fillRect(0, -21, 9, 7); ctx.fillStyle = "#1b1530"; ctx.fillRect(4, -20, 4, 5);
    ctx.fillStyle = dark; ctx.fillRect(-2, -10, 12, 3);
  } else if (k === 1) {
    ctx.strokeStyle = dark; ctx.lineWidth = 2.5; ctx.beginPath(); for (let i = 0; i <= 6; i++) ctx.lineTo(i % 2 ? 4 : -4, -i * 1.6); ctx.stroke(); // spring
    ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, -18, 12, 10, 0, 0, 6.28); ctx.fill();
    ctx.strokeStyle = dark; ctx.beginPath(); ctx.moveTo(0, -27); ctx.lineTo(3, -34); ctx.stroke(); ctx.fillStyle = "#ffd166"; ctx.beginPath(); ctx.arc(3, -35, 2.5, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(5, -19, 4.5, 0, 6.28); ctx.fill(); ctx.fillStyle = "#1b1530"; ctx.beginPath(); ctx.arc(6.5, -19, 2.3, 0, 6.28); ctx.fill();
  } else {
    ctx.fillStyle = body; ctx.beginPath(); ctx.arc(0, -16, 12, Math.PI, 0); ctx.lineTo(12, -2);
    for (let i = 0; i < 4; i++) ctx.lineTo(9 - i * 6, (i % 2 ? -2 : -6) + Math.sin(t * 10 + i) * 1.5);
    ctx.lineTo(-12, -2); ctx.fill();
    ctx.fillStyle = "#1b1530"; ctx.beginPath(); ctx.ellipse(1, -17, 2.5, 4, 0, 0, 6.28); ctx.ellipse(7, -17, 2.5, 4, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = dark; ctx.beginPath(); ctx.ellipse(4, -9, 3, 2, 0, 0, 6.28); ctx.fill();
  }
  ctx.restore();
}
function drawBubble(b, t) {
  const left = (b.k >= 0 ? CONFIG.trappedLife : CONFIG.bubbleLife) - b.age / 10;
  if (left < 1.5 && Math.floor(t * 10) % 2) ctx.globalAlpha = 0.5; // about to pop
  const r = 16 + Math.sin(t * 5 + b.i) * 0.8;
  if (b.k >= 0) { ctx.save(); ctx.translate(b.x, b.y + 9); ctx.rotate(Math.sin(t * 3 + b.i) * 0.5); drawCritter(b.k, 0, 0, 1, b.a, t, 0.7); ctx.restore(); }
  ctx.fillStyle = b.k >= 0 ? "#8be9ff30" : "#bff3ff28"; ctx.strokeStyle = b.k >= 0 ? "#8be9ff" : "#d9f8ffcc"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, 6.28); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = "#ffffffcc"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(b.x, b.y, r - 5, 3.6, 4.4); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(b.x + 6, b.y - 7, 2, 0, 6.28); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawFruit(f, t) {
  const x = f.x, y = f.y - 10 + Math.sin(t * 4 + f.i) * 1.5;
  if (f.k === 0) { ctx.strokeStyle = "#3f8f2f"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x + 1, y - 10); ctx.lineTo(x + 5, y); ctx.stroke(); ctx.fillStyle = "#e63946"; ctx.beginPath(); ctx.arc(x - 4, y + 2, 5.5, 0, 6.28); ctx.arc(x + 5, y + 3, 5.5, 0, 6.28); ctx.fill(); }
  else if (f.k === 1) { ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.beginPath(); ctx.arc(x, y - 8, 11, 0.5, 2.6); ctx.stroke(); ctx.lineCap = "butt"; }
  else if (f.k === 2) { ctx.fillStyle = "#3f8f2f"; ctx.beginPath(); ctx.arc(x, y - 2, 11, 0, Math.PI); ctx.fill(); ctx.fillStyle = "#ff5d73"; ctx.beginPath(); ctx.arc(x, y - 2, 8.5, 0, Math.PI); ctx.fill(); ctx.fillStyle = "#1b1530"; for (const dx of [-4, 0, 4]) ctx.fillRect(x + dx, y + 1, 1.6, 2.5); }
  else { ctx.fillStyle = "#59d8ff"; ctx.beginPath(); ctx.moveTo(x, y + 6); ctx.lineTo(x - 9, y - 4); ctx.lineTo(x - 4, y - 9); ctx.lineTo(x + 4, y - 9); ctx.lineTo(x + 9, y - 4); ctx.fill(); ctx.fillStyle = "#e0faff"; ctx.beginPath(); ctx.moveTo(x - 4, y - 9); ctx.lineTo(x, y - 4); ctx.lineTo(x - 9, y - 4); ctx.fill(); }
  ctx.fillStyle = "#ffffffaa"; ctx.beginPath(); ctx.arc(x - 3 + Math.sin(t * 6 + f.i) * 6, y - 12, 1.5, 0, 6.28); ctx.fill(); // a twinkle
}

// ── HUD & OVER ──────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let board = null, dropped = false;
const startedAt = performance.now();
function hud(g, L) {
  const t = Date.now();
  if (ATTRACT) { for (const id of ["bar", "msg", "hint", "net"]) $(id).textContent = ""; return; }
  $("bar").innerHTML = `<span><small>SCORE</small>${g.score}</span><span><small>LEVEL</small>${g.lv}</span><span class="hearts">${"♥".repeat(Math.max(0, g.lives))}</span>`;
  $("msg").innerHTML = g.ph === "intro" ? `Level ${g.lv}<small>${esc(L.name)}</small>` : g.ph === "clear" ? `Level clear!<small>+1 life · grab the fruit</small>` :
    g.ph === "play" && g.hurry && t - g.at < CONFIG.hurryAfter + 2000 ? "Hurry up!" : me.dead && g.ph === "play" ? "<small>Caught! Back in a moment…</small>" : "";
  $("hint").style.opacity = performance.now() - startedAt < 12000 ? 1 : 0;
  $("hint").textContent = touchUI ? "BUBBLE traps a critter · jump into it to pop it · hold JUMP to bounce on bubbles" : "Arrows to move · X blows a bubble · Z/Space jumps (hold it to bounce on bubbles) · ↓ drops down";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with a bot buddy" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the critters" : ""}`;
  const over = g.ph === "over" && t - g.at > 1200;
  $("over").hidden = !over;
  if (over) {
    $("overTitle").textContent = "Game over";
    $("overSub").textContent = `Team score ${g.score} · reached level ${g.lv}`;
    $("next").textContent = `New game in ${Math.max(0, Math.ceil((g.at + CONFIG.overMs - t) / 1000))}s`;
    if (me.shownFor !== g.id) { me.shownFor = g.id; showBoard(g.score); }
  }
}
function showBoard(score) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  board.submit(score).catch(() => null).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No scores yet. You're first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { if (isHost()) host.again = true; else net.send("again", {}); };
let audio = null; // made on the first tap or key (browsers block sound before that)
function sfx(kind) {
  if (!audio || ATTRACT) return;
  const [f0, f1, dur, vol, type] = { blow: [500, 900, 0.08, 0.05, "sine"], pop: [900, 300, 0.07, 0.08, "triangle"], trap: [300, 700, 0.18, 0.06, "sine"], boing: [200, 600, 0.15, 0.07, "triangle"],
    coin: [880, 1760, 0.12, 0.07, "square"], ouch: [400, 80, 0.4, 0.1, "sawtooth"] }[kind];
  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
document.body.classList.toggle("touch", touchUI);
$("padL").hidden = $("padR").hidden = !touchUI;
fit();
const wake = () => { if (!audio) { try { audio = new AudioContext(); } catch {} } };
const KEYS = { arrowleft: "left", a: "left", arrowright: "right", d: "right", arrowdown: "down", s: "down" };
addEventListener("keydown", (e) => {
  wake(); const k = e.key.toLowerCase();
  if (KEYS[k]) { e.preventDefault(); input[KEYS[k]] = true; }
  if ([" ", "z", "arrowup", "w", "k"].includes(k)) { e.preventDefault(); if (!e.repeat) input.jumpHit = true; input.jump = true; }
  if (["x", "j", "shift", "enter"].includes(k)) { e.preventDefault(); if (!e.repeat) input.blowHit = true; }
});
addEventListener("keyup", (e) => { const k = e.key.toLowerCase(); if (KEYS[k]) input[KEYS[k]] = false; if ([" ", "z", "arrowup", "w", "k"].includes(k)) input.jump = false; });
addEventListener("blur", () => { input.left = input.right = input.down = input.jump = false; });
for (const b of document.querySelectorAll(".pad button")) {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", (e) => {
    e.preventDefault(); wake(); b.setPointerCapture(e.pointerId); b.classList.add("on");
    if (k === "jump") { input.jump = true; input.jumpHit = true; } else if (k === "blow") input.blowHit = true; else input[k] = true;
  });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => { if (k === "jump") input.jump = false; else if (k !== "blow") input[k] = false; b.classList.remove("on"); });
}
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); wake(); });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, frameNo = 0, seenPhase = "";
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.acting = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have hosted meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; frameNo++; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.acting = false;
  const g = game();
  if (!g) return;
  const L = levelOf(g.lv);
  frameScene = buildScene(dt);
  myTick(dt, g, L);
  if (g.ph + g.lv + g.id !== seenPhase) { seenPhase = g.ph + g.lv + g.id; if (g.ph === "clear") { for (let i = 0; i < 40; i++) puff(320, 240, COLORS[i % COLORS.length], 1, 400); sfx("coin"); } }
  for (let i = sparks.length - 1; i >= 0; i--) { const p = sparks[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; if (p.life <= 0) sparks.splice(i, 1); }
  for (let i = texts.length - 1; i >= 0; i--) { const x = texts[i]; x.life -= dt * 0.8; x.y -= 30 * dt; if (x.life <= 0) texts.splice(i, 1); }
  for (const [k, at] of gone) if (now - at > 1500) gone.delete(k);
  draw(g, L, dt, now / 1000);
  if (now - lastHud > 120) { lastHud = now; hud(g, L); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("blow", (msg, from) => { if (host.acting && isHost() && msg) applyBlow(from, msg); });
  net.on("pop", (msg, from) => { if (host.acting && isHost() && msg) applyPop(from, msg); });
  net.on("grab", (msg, from) => { if (host.acting && isHost() && msg) applyGrab(from, msg); });
  net.on("hurt", (msg, from) => { if (host.acting && isHost() && msg) applyHurt(from, Number(msg.n) || 0); });
  net.on("again", () => { const g = game(); if (host.acting && g && g.ph === "over") host.again = true; });
  net.on("fx", (msg) => onFx(msg));
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  me.id = net.sessionId;
  const taken = takenColors();
  me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
